# Allow-listing egress proxy for the code-patching sandbox (spec §5.5).
# Sandbox containers sit on the internal network patchbot-sandbox-egress (no route to the internet);
# this proxy is their only way out and forwards HTTPS to package registries only.
http_port 3128

acl registries dstdomain registry.npmjs.org .pypi.org files.pythonhosted.org
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
# Only HTTPS tunnels: plain-HTTP requests (GET http://registry.npmjs.org/...) would be forwarded unencrypted.
http_access deny !CONNECT
http_access deny !registries
http_access allow registries
http_access deny all

# Pure forwarder: no caching, no state on disk, runs as the unprivileged squid user.
cache deny all
pid_filename none
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0
coredump_dir /tmp
forwarded_for delete
via off
shutdown_lifetime 3 seconds
