name: Renovate

"on":
  schedule:
    # Mo–Do 02:00 UTC (nach ack-desk nightly-merge-back um 01:00 UTC): Sammel-PR erstellen/aktualisieren.
    - cron: "0 2 * * 1-4"
    # Mo–Do 03:00 UTC: grünen Sammel-PR nach abgeschlossenen CircleCI-Checks automatisch mergen.
    - cron: "0 3 * * 1-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run mode ('full' previews planned PRs in logs; 'off' creates/merges PRs)"
        required: false
        type: choice
        options:
          - "full"
          - "lookup"
          - "off"
        default: "full"

permissions:
  contents: read
  id-token: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout configuration
        uses: actions/checkout@v6

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: westcoder

      - name: Configure Renovate bot identity and optional dry-run
        id: bot-env
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          DRY_RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run == 'full' || inputs.dry_run == 'lookup') && inputs.dry_run || '' }}
        run: |
          set -euo pipefail
          BOT_ID="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          test -n "${BOT_ID}"
          echo "git_author=${APP_SLUG}[bot] <${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
          if [ -n "${DRY_RUN_MODE}" ]; then
            echo "RENOVATE_DRY_RUN=${DRY_RUN_MODE}" >> "$GITHUB_ENV"
          fi

      - name: Mint short-lived AWS CodeArtifact token via OIDC
        env:
          ROLE_ARN: arn:aws:iam::069962555850:role/westcode-infra/github-renovate-codeartifact-read
          AWS_DEFAULT_REGION: eu-central-1
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)"
          if ! CREDS="$(aws sts assume-role-with-web-identity \
            --role-arn "${ROLE_ARN}" \
            --role-session-name "renovate-${GITHUB_RUN_ID}" \
            --web-identity-token "${OIDC_TOKEN}" \
            --duration-seconds 3600 \
            --query Credentials \
            --output json 2>&1)"; then
            echo "::error::Could not assume ${ROLE_ARN}"
            echo "${CREDS}"
            python3 - "${OIDC_TOKEN}" <<'CLAIMS'
          import base64, json, sys
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps({k: claims[k] for k in ("sub", "aud", "repository", "ref") if k in claims}, indent=2))
          CLAIMS
            exit 1
          fi
          AWS_ACCESS_KEY_ID="$(jq -r .AccessKeyId <<<"${CREDS}")"
          AWS_SECRET_ACCESS_KEY="$(jq -r .SecretAccessKey <<<"${CREDS}")"
          AWS_SESSION_TOKEN="$(jq -r .SessionToken <<<"${CREDS}")"
          echo "::add-mask::${AWS_ACCESS_KEY_ID}"
          echo "::add-mask::${AWS_SECRET_ACCESS_KEY}"
          echo "::add-mask::${AWS_SESSION_TOKEN}"
          CA_TOKEN="$(AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" \
            AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" \
            AWS_SESSION_TOKEN="${AWS_SESSION_TOKEN}" \
            aws codeartifact get-authorization-token \
              --domain westcode \
              --domain-owner 069962555850 \
              --query authorizationToken \
              --output text)"
          test -n "${CA_TOKEN}"
          echo "::add-mask::${CA_TOKEN}"
          HOST_RULES="$(jq -cn --arg pw "${CA_TOKEN}" '[{
            matchHost: "westcode-069962555850.d.codeartifact.eu-central-1.amazonaws.com",
            hostType: "pypi",
            username: "aws",
            password: $pw
          }]')"
          echo "RENOVATE_HOST_RULES=${HOST_RULES}" >> "$GITHUB_ENV"

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.13
        with:
          configurationFile: deploy/renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: info
          RENOVATE_USERNAME: "${{ steps.app-token.outputs.app-slug }}[bot]"
          RENOVATE_GIT_AUTHOR: ${{ steps.bot-env.outputs.git_author }}
