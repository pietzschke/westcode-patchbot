[project]
name = "westcode-patchbot-backend"
version = "0.1.0"
description = "Westcode Patchbot control plane backend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.16",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    "pytest>=8",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = ["."]
