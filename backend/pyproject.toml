[project]
name = "westcode-patchbot-backend"
version = "0.1.0"
description = "Westcode Patchbot control plane backend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.16",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "requests>=2.32",
    "pytest>=8",
    "pytest-django>=4.9",
    "pyjwt[crypto]>=2.9",
    "holidays>=0.60",
    "anthropic>=2.5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = [".", ".."]
testpaths = ["fleet/tests", "inventory/tests", "triage/tests", "research/tests", "catalog/tests", "rollouts/tests", "alerts/tests", "../agent/tests"]
